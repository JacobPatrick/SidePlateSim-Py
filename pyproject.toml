[tool.black]
line-length = 80

# 目标 Python 版本
target-version = ['py311']

# 追加排除的目录或文件（正则表达式）
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations  # 排除 Django/SQLAlchemy 的数据库迁移文件
  | node_modules
)/
'''

# 是否保留单引号（如果团队习惯单引号，设为 true）
skip-string-normalization = true

# 是否禁用魔术尾随逗号强制换行
skip-magic-trailing-comma = false

# 是否启用预览模式
preview = false
